name: example

on:
  push:

jobs:
  s3ls:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDCトークンの取得に必須
      contents: read
    steps:
      - uses: actions/checkout@v4

      # ▼ デバッグ用：GitHubがAWSに送るトークンの中身を表示（原因が分かったら削除）
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          python3 -c "import sys,json,base64;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);d=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:d.get(k) for k in ['sub','aud','repository','ref']},indent=2))" "$TOKEN"
      # ▲ デバッグ用ここまで

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: 'us-east-1'
          role-to-assume: 'arn:aws:iam::105565643547:role/OIDC-TEST'

      - name: Check identity
        run: aws sts get-caller-identity

      - name: List S3 buckets
        run: aws s3 ls

      - name: List IAM users
        run: |
          aws iam list-users \
            --query 'Users[].[UserName,CreateDate,PasswordLastUsed]' \
            --output table
