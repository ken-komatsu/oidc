name: example

on:
  push:

jobs:
  s3ls:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::105565643547:role/OIDC-TEST

      - run: aws sts get-caller-identity
